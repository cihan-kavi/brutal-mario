<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Brutal Mario — Kaizo Sürümü</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  h1 { font-size: 18px; margin-bottom: 8px; color: #ff4444; letter-spacing: 2px; }
  #hud { display: flex; gap: 24px; margin-bottom: 6px; font-size: 13px; }
  #hud span { color: #ffd700; }
  canvas {
    border: 4px solid #444;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }
  #msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.92);
    border: 3px solid #ff4444;
    padding: 24px 36px;
    text-align: center;
    font-size: 16px;
    display: none;
    z-index: 10;
    max-width: 420px;
    line-height: 1.6;
  }
  #msg h2 { color: #ff4444; margin-bottom: 12px; font-size: 22px; }
  #msg button {
    margin-top: 16px; padding: 10px 28px;
    background: #e52521; color: #fff; border: none;
    font-family: inherit; font-size: 14px; cursor: pointer;
  }
  #msg button:hover { background: #ff4444; }
  .controls { margin-top: 8px; font-size: 11px; color: #888; }
  #cheats {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; font-size: 11px;
  }
  #cheats .tag { color: #ffd700; letter-spacing: 1px; }
  #cheats button, #cheats select {
    background: #222; color: #ddd; border: 1px solid #555;
    font-family: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
  }
  #cheats button:hover, #cheats select:hover { background: #333; color: #fff; }
  #cheats button.on { background: #e52521; border-color: #ff6b6b; color: #fff; }
  #cheats .hint { color: #666; margin-left: 4px; }

  /* --- Telefon --- Ekran küçükse oyun ekrana sığdırılır, kontroller
     tuvalin üstüne biner ve klavye yazıları gizlenir. */
  #touch, #rotate { display: none; }
  body.touch #touch { display: flex; }
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0;
    justify-content: space-between; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    pointer-events: none; z-index: 20;
  }
  #touch .pad { display: flex; gap: 14px; pointer-events: auto; }
  .tbtn {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(20,20,20,0.5); border: 2px solid #777; color: #eee;
    font-family: inherit; font-size: 22px; line-height: 1;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .tbtn.jump {
    width: 88px; height: 88px; font-size: 13px; letter-spacing: 1px;
    border-color: #e52521; background: rgba(229,37,33,0.4);
  }
  .tbtn.small { width: 46px; height: 46px; font-size: 14px; }
  .tbtn.down { background: rgba(229,37,33,0.85); border-color: #ff6b6b; color: #fff; }
  body.touch.portrait { justify-content: center; padding-bottom: 150px; }
  body.touch.portrait #rotate {
    display: block; position: fixed; bottom: 120px; left: 0; right: 0;
    text-align: center; font-size: 15px; color: #ffd700;
    text-shadow: 0 0 8px #000; pointer-events: none; z-index: 21;
  }
  @media (pointer: coarse), (max-width: 900px) {
    body {
      justify-content: flex-start; padding-top: 4px;
      touch-action: none; max-width: 100vw; overflow-x: hidden;
    }
    h1 { font-size: 13px; margin-bottom: 2px; }
    #hud { gap: 16px; font-size: 12px; margin-bottom: 4px; }
    .controls { display: none; }
    #cheats .hint { display: none; }
    #cheats { margin-top: 4px; flex-wrap: wrap; justify-content: center; max-width: 100vw; }
    #cheats select { max-width: 42vw; }
    canvas {
      border-width: 2px;
      aspect-ratio: 800 / 480;
      width: min(calc(100vw - 6px), calc((100vh - 96px) * 800 / 480));
      width: min(calc(100vw - 6px), calc((100dvh - 96px) * 800 / 480));
      height: auto;
    }
  }
  /* Yan çevrilmiş telefonda yükseklik değerli: başlık gider, üst bar tuvalin
     boş göğüne biner, tuval kalan yüksekliği tamamen kaplar. */
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch h1 { display: none; }
    body.touch #hud {
      position: fixed; top: 4px; left: 10px; margin: 0;
      gap: 12px; font-size: 11px; z-index: 22;
    }
    body.touch #cheats { position: fixed; top: 2px; right: 10px; margin: 0; z-index: 22; }
    body.touch #cheats select { max-width: 34vw; }
    body.touch canvas {
      width: auto; height: calc(100dvh - 8px); max-width: calc(100vw - 6px);
    }
    /* Tuşlar tuvalin kenarına mümkün olduğunca az binsin. */
    body.touch #touch { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
    body.touch #touch .pad { gap: 8px; }
    body.touch .tbtn { width: 56px; height: 56px; font-size: 20px; }
    body.touch .tbtn.jump { width: 84px; height: 84px; font-size: 12px; }
    body.touch .tbtn.small { width: 40px; height: 40px; font-size: 13px; }
  }

let lives = 3, coins = 0, levelIdx = 0, shake = 0, particles = [];

const player = {

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') restartLevel();
  if (!e.repeat) {
    if (e.code === 'BracketRight') jumpToLevel(levelIdx + 1);
    if (e.code === 'BracketLeft') jumpToLevel(levelIdx - 1);
    if (e.code === 'KeyG') toggleGod();
    if (e.code === 'KeyF') toggleFly();
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (digit) jumpToLevel(Number(digit[1]) - 1);
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.code] = false);

// Level format: strings, each char = tile

let tiles = [], enemies = [], camX = 0, levelW = 0;

function charToTile(c) {
  const m = {
    '#': T.GROUND, 'B': T.BRICK, '?': T.QUESTION, 'S': T.SPIKE,
    'F': T.FAKE, 'I': T.INVISIBLE, 'P': T.SPRING, 'C': T.CRUMBLE,
    'M': T.MOVING, 'V': T.CONVEYOR, 'X': T.DEATH, 'G': T.GOAL,
    '|': T.PIPE, '~': T.CLOUD, 'T': T.TROLL_Q, 'L': T.LAUNCHER,
    '^': T.SPIKE_D
  };
  return m[c] || T.EMPTY;
}

function loadLevel(idx) {
  const lv = LEVELS[idx];
  const cols = Math.max(...lv.map.map(r => r.length));
  tiles = lv.map.map(row => row.padEnd(cols, ' ').split('').map(charToTile));
  // Bedrock course: stone below every walkable tile, spikes at the bottom of every pit
  tiles.push(tiles[tiles.length - 1].map(t => t === T.EMPTY ? T.SPIKE : T.GROUND));
  levelW = cols * TILE;
  fakeBroken.clear();
  crumbleTimers = {};
  invisibleShown.clear();
  blamed = null;
  movingPlatOffsets = {};
  particles = [];
  enemies = (lv.extras || []).map(e => ({
    type: e.type, x: e.x * TILE, y: e.y * TILE,
    w: 28, h: 28, vx: e.type === 'goomba' ? -1.2 : 0,
    vy: 0, dead: false, dir: -1, flyT: Math.random() * 6
  }));
  player.x = lv.spawn[0] * TILE;
  player.y = lv.spawn[1] * TILE - player.h;
  player.vx = player.vy = 0;
  player.dead = false;
  player.riding = null;
  player.invincible = 60;
  document.getElementById('level').textContent = idx + 1;
  syncCheats();
}

function tileAt(tx, ty) {
  if (ty < 0 || ty >= tiles.length || tx < 0 || tx >= tiles[0].length) return T.EMPTY;
  const key = tx + ',' + ty;
  if (fakeBroken.has(key)) return T.EMPTY;
  if (crumbleTimers[key] !== undefined && crumbleTimers[key] <= 0) return T.EMPTY;
  return tiles[ty][tx];
}

function isSolid(t) {
  return [T.GROUND, T.BRICK, T.QUESTION, T.FAKE, T.INVISIBLE, T.MOVING,
    T.CRUMBLE, T.PIPE, T.CLOUD, T.TROLL_Q, T.DEATH,
    T.CONVEYOR, T.SPRING, T.LAUNCHER].includes(t);
}

function getMovingOffset(tx, ty) {
  const key = tx + ',' + ty;
  if (movingPlatOffsets[key] === undefined) movingPlatOffsets[key] = 0;
  return movingPlatOffsets[key];
}

function updateMovingPlatforms() {
  for (let y = 0; y < tiles.length; y++) {
    for (let x = 0; x < tiles[0].length; x++) {
      if (tiles[y][x] === T.MOVING) {
        const key = x + ',' + y;
        movingPlatOffsets[key] = (movingPlatOffsets[key] || 0) + MOVING_SPEED;
      }
    }
  }
}

function movingTop(tx, ty) {
  return ty * TILE + Math.sin(getMovingOffset(tx, ty)) * MOVING_AMP;
}

function hitBox(x, y, w, h) {
  const hits = [];
  const x1 = Math.floor(x / TILE), x2 = Math.floor((x + w - 1) / TILE);
  const y1 = Math.floor(y / TILE), y2 = Math.floor((y + h - 1) / TILE);
  // A moving platform sits up to MOVING_AMP away from its own row, which is
  // more than one tile, so scan wider and test where it actually is.
  const pad = Math.ceil(MOVING_AMP / TILE);
  for (let ty = y1 - pad; ty <= y2 + pad; ty++) {
    for (let tx = x1; tx <= x2; tx++) {
      const t = tileAt(tx, ty);
      if (t === T.EMPTY || t === T.GOAL || t === T.SPIKE || t === T.SPIKE_D) continue;
      if (!isSolid(t)) continue;
      if (t !== T.MOVING && (ty < y1 || ty > y2)) continue;
      const oy = t === T.MOVING ? movingTop(tx, ty) : ty * TILE;
      if (oy + TILE <= y || oy >= y + h) continue;
      hits.push({ tx, ty, t, x: tx * TILE, y: oy, w: TILE, h: TILE });
    }
  }
  return hits;
}

function checkSpikes(x, y, w, h) {
  const x1 = Math.floor(x / TILE), x2 = Math.floor((x + w - 1) / TILE);
  const y1 = Math.floor(y / TILE), y2 = Math.floor((y + h - 1) / TILE);
  for (let ty = y1; ty <= y2; ty++) {
    for (let tx = x1; tx <= x2; tx++) {
      const st = tileAt(tx, ty);
      if (st === T.SPIKE || st === T.SPIKE_D) return true;
    }
  }
  return false;
}

function checkGoal() {
  const tx = Math.floor((player.x + player.w / 2) / TILE);
  const ty = Math.floor((player.y + player.h / 2) / TILE);
  return tileAt(tx, ty) === T.GOAL;
}

function killPlayer(reason) {
  if (godMode || flyMode) return;
  if (player.dead || player.invincible > 0) return;
  player.dead = true;
  lives--;
  updateLives();
  shake = 12;
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: player.x + player.w / 2, y: player.y + player.h / 2,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      life: 40 + Math.random() * 20, color: ['#e52521','#ff6b6b','#ffd700','#fff'][Math.floor(Math.random()*4)]
    });
  }
  // Dikene çarpmak ya da çukura düşmek genelde bir tuzağın sonucudur, o
  // yüzden suç hâlâ tazeyse tuzağa yazılır.
  const blamable = reason === 'pit' || reason === 'spike';
  const death = DEATHS[blamable && blamed ? blamed.kind : reason] || DEATHS.generic;
  showBanner(death.title, death.msgs[Math.floor(Math.random() * death.msgs.length)], 100);
  schedule(70, restartLevel);
}

function updateLives() {
  const el = document.getElementById('lives');
  el.textContent = lives;
  el.style.color = lives < 0 ? '#ff4444' : '';
}

// Oyuncuyu iten tuzağı kısa süre hatırla; ölüm mesajı bunu kullanıyor.
function blame(kind, frames) {
  blamed = { kind, life: frames };
}

function bumpBlock(tx, ty) {
  const t = tileAt(tx, ty);
  const key = tx + ',' + ty;
  if (t === T.QUESTION) {
    tiles[ty][tx] = T.BRICK;
    coins++;
    document.getElementById('coins').textContent = coins;
    spawnParticles(tx * TILE + 16, ty * TILE + 16, '#ffd700', 8);
  } else if (t === T.TROLL_Q) {
    tiles[ty][tx] = T.EMPTY;
    // Spawn enemy above
    enemies.push({ type: 'goomba', x: tx * TILE, y: (ty - 1) * TILE, w: 28, h: 28, vx: 0, vy: -4, dead: false, dir: -1, flyT: 0 });
    spawnParticles(tx * TILE + 16, ty * TILE + 16, '#ff4444', 12);
  } else if (t === T.BRICK) {
    spawnParticles(tx * TILE + 16, ty * TILE + 16, '#c84', 6);
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
      life: 25 + Math.random()*15, color
    });
  }
}

function updatePlayer() {
  if (player.dead) return;
  if (player.invincible > 0) player.invincible--;

  // Cheat: roam the level freely, ignoring gravity, walls and the goal flag.
  if (flyMode) {
    const step = keys['ShiftLeft'] || keys['ShiftRight'] ? 12 : 6;
    player.vx = player.vy = 0;
    player.grounded = false;
    player.riding = null;
    if (keys['ArrowLeft'] || keys['KeyA']) { player.x -= step; player.facing = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { player.x += step; player.facing = 1; }
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= step;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += step;
    player.x = Math.max(0, Math.min(player.x, levelW - player.w));
    player.y = Math.max(0, Math.min(player.y, H - player.h));
    player.anim += 0.2;
    camX = Math.max(0, Math.min(player.x - W / 3, levelW - W));
    return;
  }

  player.vx = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -MOVE; player.facing = -1; }
  if (keys['ArrowRight'] || keys['KeyD']) { player.vx = MOVE; player.facing = 1; }

  if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
    player.vy = JUMP;
    player.grounded = false;
    player.springBoost = 0;
    player.riding = null;
  }

  // Conveyor
  const ctx2 = Math.floor((player.x + player.w/2) / TILE);
  const cty2 = Math.floor((player.y + player.h) / TILE);
  if (tileAt(ctx2, cty2) === T.CONVEYOR) player.vx += 2.5 * player.facing;

  player.vy += GRAVITY;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  // X movement
  let nx = player.x + player.vx;
  const hxHits = hitBox(nx, player.y, player.w, player.h);
  for (const h of hxHits) {
    if (h.t === T.DEATH) { killPlayer('death'); return; }
    // Running into an invisible block has to show it, otherwise the player
    // just stops in mid-air for no reason they can see.
    if (h.t === T.INVISIBLE) {
      invisibleShown.add(h.tx + ',' + h.ty);
      blame('invisible', 45);
    }
    if (player.vx > 0) nx = h.x - player.w;
    else if (player.vx < 0) nx = h.x + h.w;
  }
  player.x = nx;

  // Y movement
  player.grounded = false;
  let ny = player.y + player.vy;
  const hyHits = hitBox(player.x, ny, player.w, player.h);
  for (const h of hyHits) {
    if (h.t === T.DEATH) { killPlayer('death'); return; }
    if (h.t === T.FAKE) {
      fakeBroken.add(h.tx + ',' + h.ty);
      spawnParticles(h.x + 16, h.y + 16, '#888', 8);
      blame('fake', 90);
      continue;
    }
    if (h.t === T.CRUMBLE) {
      const key = h.tx + ',' + h.ty;
      if (crumbleTimers[key] === undefined) crumbleTimers[key] = 30;
      blame('crumble', 60);
    }
    if (h.t === T.INVISIBLE) invisibleShown.add(h.tx + ',' + h.ty);

    if (player.vy > 0) {
      ny = h.y - player.h;
      player.grounded = true;
      player.vy = 0;
      // hitBox already reports the platform at its current height, so landing
      // on it is enough to ride it upward; only the descent needs the anchor.
      player.riding = h.t === T.MOVING ? { tx: h.tx, ty: h.ty } : null;
    } else if (player.vy < 0) {
      ny = h.y + h.h;
      player.vy = 0;
      // Only a head bonk counts as the block's fault; landing on one in the
      // invisible bridge level is the player doing it right.
      if (h.t === T.INVISIBLE) blame('invisible', 45);
      bumpBlock(h.tx, h.ty);
    }
  }

  // A sinking platform outruns gravity for a few frames, so pull the player
  // down with it instead of letting the gap reopen every frame.
  if (player.riding && player.vy >= 0) {
    const { tx, ty } = player.riding;
    const onIt = player.x + player.w > tx * TILE && player.x < (tx + 1) * TILE;
    if (tileAt(tx, ty) === T.MOVING && onIt) {
      const top = movingTop(tx, ty);
      const gap = top - (ny + player.h);
      if (gap >= 0 && gap <= 6) {
        ny = top - player.h;
        player.grounded = true;
        player.vy = 0;
      }
    } else {
      player.riding = null;
    }
  }

  // Spring check
  const stx = Math.floor((player.x + player.w/2) / TILE);
  const sty = Math.floor((ny + player.h) / TILE);
  if (player.grounded && tileAt(stx, sty) === T.SPRING) {
    player.vy = -18;
    player.grounded = false;
    player.springBoost = 30;
    blame('spring', 90);
    shake = 4;
    spawnParticles(stx * TILE + 16, sty * TILE, '#0f0', 10);
  }
  if (player.grounded && tileAt(stx, sty) === T.LAUNCHER) {
    player.vy = -22;
    player.vx = 8 * player.facing;
    player.grounded = false;
    blame('launcher', 110);
    shake = 6;
    spawnParticles(stx * TILE + 16, sty * TILE, '#f0f', 14);
  }

  player.y = ny;

  // Fake block - fall through from above
  if (player.vy >= 0) {
    const ftx = Math.floor((player.x + player.w/2) / TILE);
    const fty = Math.floor((player.y + player.h - 2) / TILE);
    if (tileAt(ftx, fty) === T.FAKE && !fakeBroken.has(ftx+','+fty)) {
      // Only break if landing on top
      const blockTop = fty * TILE;
      if (player.y + player.h - player.vy <= blockTop + 4) {
        fakeBroken.add(ftx + ',' + fty);
        spawnParticles(ftx * TILE + 16, fty * TILE + 16, '#888', 8);
        blame('fake', 90);
        player.grounded = false;
      }
    }
  }

  if (checkSpikes(player.x, player.y, player.w, player.h)) killPlayer('spike');
  if (player.y > H + 50) killPlayer('pit');
  if (checkGoal()) winLevel();

  // Crumble timers
  for (const key in crumbleTimers) {
    crumbleTimers[key]--;
  }

  player.anim += 0.2;
  camX = Math.max(0, Math.min(player.x - W/3, levelW - W));
}

function updateEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.type === 'goomba') {
      e.vy += GRAVITY;
      if (e.vy > MAX_FALL) e.vy = MAX_FALL;
      let ex = e.x + e.vx;
      if (hitBox(ex, e.y, e.w, e.h).length) e.vx *= -1;
      e.x = ex;
      let ey = e.y + e.vy;
      if (hitBox(e.x, ey, e.w, e.h).length) { ey = e.y; e.vy = 0; }
      else e.y = ey;
      if (e.y > H + 50) e.dead = true;
    } else if (e.type === 'flying') {
      e.flyT += 0.05;
      e.x += Math.sin(e.flyT) * 2;
      e.y += Math.cos(e.flyT * 0.7) * 1.5;
    }

    // Player collision
    if (!player.dead && player.invincible <= 0 &&
        player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 8) {
        e.dead = true;
        player.vy = JUMP * 0.6;
        coins++;
        document.getElementById('coins').textContent = coins;
        spawnParticles(e.x + 14, e.y + 14, '#8B4513', 10);
      } else {
        killPlayer('enemy');
      }
    }
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake--;
}

// Stone brick surface: 2 brick courses per tile, offset per row, seamless across tiles
function drawStone(x, y, tx, ty, tint) {
  const shades = tint || ['#eccaa2', '#e0bb8f', '#d4ac7e', '#e6c398'];
  ctx.fillStyle = '#2b1a0e';
  ctx.fillRect(x, y, TILE, TILE);
  for (let course = 0; course < 2; course++) {
    const by = y + course * 16;
    const globalRow = ty * 2 + course;
    const shift = (globalRow % 2) * 8;
    for (let b = -1; b <= 2; b++) {
      const bx = x + b * 16 + shift;
      const x0 = Math.max(bx, x), x1 = Math.min(bx + 15, x + TILE);
      if (x1 <= x0) continue;
      const seed = Math.abs(Math.floor(bx / 16) * 7 + globalRow * 13) % shades.length;
      ctx.fillStyle = shades[seed];
      ctx.fillRect(x0, by + 1, x1 - x0, 14);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(x0, by + 1, x1 - x0, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(x0, by + 13, x1 - x0, 2);
    }
  }
}

function drawSpikes(x, y, down) {
  ctx.fillStyle = '#3a2b1e';
  if (down) ctx.fillRect(x, y, TILE, 8);
  else ctx.fillRect(x, y + TILE - 8, TILE, 8);
  for (let i = 0; i < 4; i++) {
    const sx = x + i * 8;
    const grad = ctx.createLinearGradient(sx, 0, sx + 8, 0);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#f2f2f2');
    grad.addColorStop(1, '#b9b9b9');
    ctx.fillStyle = grad;
    ctx.beginPath();
    if (down) {
      ctx.moveTo(sx, y + 8); ctx.lineTo(sx + 4, y + 26); ctx.lineTo(sx + 8, y + 8);
    } else {
      ctx.moveTo(sx, y + TILE - 8); ctx.lineTo(sx + 4, y + TILE - 26); ctx.lineTo(sx + 8, y + TILE - 8);
    }
    ctx.fill();
  }
}

function drawTile(t, x, y, tx, ty) {
  const key = tx + ',' + ty;
  switch (t) {
    case T.GROUND:
      drawStone(x, y, tx, ty);
      break;
    case T.BRICK:
      drawStone(x, y, tx, ty);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
      break;
    case T.QUESTION:
      ctx.fillStyle = '#2b1a0e'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#f0a422'; ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + 2, y + 2, TILE - 4, 4);
      ctx.fillStyle = '#5a3200'; ctx.font = 'bold 20px monospace';
      ctx.fillText('?', x + 11, y + 24);
      break;
    case T.TROLL_Q:
      ctx.fillStyle = '#2b1a0e'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#f0a422'; ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + 2, y + 2, TILE - 4, 4);
      ctx.fillStyle = '#5a3200'; ctx.font = 'bold 20px monospace';
      ctx.fillText('?', x + 11, y + 24);
      break;
    case T.SPIKE:
      drawSpikes(x, y, false);
      break;
    case T.SPIKE_D:
      drawSpikes(x, y, true);
      break;
    case T.FAKE:
      if (!fakeBroken.has(key)) {
        drawStone(x, y, tx, ty);
        ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
      }
      break;
    case T.INVISIBLE:
      if (invisibleShown.has(key)) {
        drawStone(x, y, tx, ty, ['#8f7f6a', '#83735f', '#786854', '#8a7a66']);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
      }
      break;
    case T.SPRING:
      ctx.fillStyle = '#241708'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#5a5a5a'; ctx.fillRect(x + 2, y + TILE - 8, TILE - 4, 8);
      ctx.fillStyle = '#d64b2a';
      ctx.fillRect(x + 6, y + 18, TILE - 12, 6);
      ctx.fillRect(x + 6, y + 10, TILE - 12, 6);
      ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x + 3, y, TILE - 6, 8);
      break;
    case T.LAUNCHER:
      ctx.fillStyle = '#241708'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#4a3a2a'; ctx.fillRect(x, y + TILE - 10, TILE, 10);
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.moveTo(x + 16, y + 2); ctx.lineTo(x + 5, y + 20);
      ctx.lineTo(x + 27, y + 20); ctx.fill();
      ctx.fillStyle = '#ffe082'; ctx.fillRect(x + 12, y + 20, 8, TILE - 26);
      break;
    case T.CRUMBLE:
      if (crumbleTimers[key] === undefined || crumbleTimers[key] > 0) {
        const a = crumbleTimers[key] !== undefined ? crumbleTimers[key] / 30 : 1;
        ctx.globalAlpha = 0.35 + a * 0.65;
        drawStone(x, y, tx, ty, ['#b59a7c', '#a98e70', '#9d8264', '#b0957a']);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 6, y); ctx.lineTo(x + 14, y + TILE);
        ctx.moveTo(x + 24, y); ctx.lineTo(x + 18, y + TILE);
        ctx.stroke();
      }
      break;
    case T.MOVING: {
      const oy = Math.sin(getMovingOffset(tx, ty)) * MOVING_AMP;
      drawStone(x, y + oy, tx, ty, ['#c9b39a', '#bda78e', '#b19b82', '#c4ae95']);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + oy + 1, TILE - 2, TILE - 2);
      break;
    }
    case T.CONVEYOR: {
      drawStone(x, y + 10, tx, ty, ['#7a6b58', '#6f6050', '#645648', '#756654']);
      ctx.fillStyle = '#241708'; ctx.fillRect(x, y, TILE, 10);
      ctx.fillStyle = '#8d7b66'; ctx.fillRect(x, y + 1, TILE, 8);
      ctx.fillStyle = '#d8c6ad';
      const off = (Date.now() / 40 + x) % 16;
      for (let i = -1; i < 3; i++) ctx.fillRect(x + i * 16 + off, y + 3, 8, 4);
      break;
    }
    case T.DEATH:
      drawStone(x, y, tx, ty, ['#8a4a3a', '#7e4030', '#733626', '#85463a']);
      ctx.fillStyle = '#ffdddd'; ctx.font = 'bold 16px monospace';
      ctx.fillText('☠', x + 9, y + 22);
      break;
    case T.GOAL:
      ctx.fillStyle = '#6b5a48'; ctx.fillRect(x + 8, y + TILE - 6, 16, 6);
      ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x + 14, y, 4, TILE - 4);
      ctx.fillStyle = '#e52521';
      ctx.beginPath();
      ctx.moveTo(x + 18, y + 2); ctx.lineTo(x + 32, y + 8);
      ctx.lineTo(x + 18, y + 14); ctx.fill();
      break;
    case T.PIPE:
      drawStone(x, y, tx, ty, ['#8b8378', '#7f776c', '#736b60', '#877f74']);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x, y, 3, TILE); ctx.fillRect(x + TILE - 3, y, 3, TILE);
      break;
    case T.CLOUD:
      drawStone(x, y, tx, ty, ['#d9c4a8', '#cdb89c', '#c1ac90', '#d4bfa3']);
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x, y, TILE, 3);
      break;
  }
}

function drawMario(x, y) {
  if (player.dead) return;
  const flash = player.invincible > 0 && Math.floor(player.invincible / 4) % 2;
  if (flash) return;

  // Body
  ctx.fillStyle = '#e52521';
  ctx.fillRect(x + 4, y + 10, 16, 14);
  // Overalls
  ctx.fillStyle = '#2266cc';
  ctx.fillRect(x + 4, y + 18, 16, 10);
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(x + 6, y + 2, 12, 10);
  // Hat
  ctx.fillStyle = '#e52521';
  ctx.fillRect(x + 4, y, 16, 6);
  ctx.fillRect(x + 2, y + 4, 6, 4);
  // Eye
  ctx.fillStyle = '#000';
  ctx.fillRect(x + (player.facing > 0 ? 14 : 8), y + 5, 2, 2);
  // Mustache
  ctx.fillStyle = '#4a2800';
  ctx.fillRect(x + 8, y + 10, 10, 3);
  // Legs anim
  const legOff = player.grounded ? Math.sin(player.anim) * 3 : 0;
  ctx.fillStyle = '#2266cc';
  ctx.fillRect(x + 5, y + 24, 6, 4 + legOff);
  ctx.fillRect(x + 13, y + 24, 6, 4 - legOff);
  // Shoes
  ctx.fillStyle = '#4a2800';
  ctx.fillRect(x + 3, y + 26 + legOff, 8, 4);
  ctx.fillRect(x + 13, y + 26 - legOff, 8, 4);
}

function drawGoomba(x, y) {
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.ellipse(x + 14, y + 20, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 6, y + 14, 6, 8); ctx.fillRect(x + 16, y + 14, 6, 8);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 8, y + 16, 3, 4); ctx.fillRect(x + 18, y + 16, 3, 4);
  ctx.fillStyle = '#5a2d0c';
  ctx.fillRect(x + 2, y + 24, 10, 4); ctx.fillRect(x + 16, y + 24, 10, 4);
}

function drawFlying(x, y) {
  ctx.fillStyle = '#44f';
  ctx.beginPath(); ctx.ellipse(x + 14, y + 16, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 8, y + 12, 5, 6); ctx.fillRect(x + 16, y + 12, 5, 6);
  ctx.fillStyle = '#f00';
  ctx.fillRect(x + 10, y + 14, 2, 3); ctx.fillRect(x + 18, y + 14, 2, 3);
  // Wings
  ctx.fillStyle = '#aaf';
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 14); ctx.lineTo(x - 6, y + 8); ctx.lineTo(x + 4, y + 18); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 26, y + 14); ctx.lineTo(x + 34, y + 8); ctx.lineTo(x + 24, y + 18); ctx.fill();
}

function draw() {
  const sx = shake ? (Math.random()-0.5)*shake : 0;
  const sy = shake ? (Math.random()-0.5)*shake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  // Pitch black void background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camX, 0);

  // Tiles
  const startCol = Math.floor(camX / TILE);
  const endCol = startCol + Math.ceil(W / TILE) + 1;
  for (let ty = 0; ty < tiles.length; ty++) {
    for (let tx = startCol; tx <= endCol; tx++) {
      const t = tileAt(tx, ty);
      if (t !== T.EMPTY) drawTile(t, tx * TILE, ty * TILE, tx, ty);
    }
  }

  // Enemies
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.type === 'goomba') drawGoomba(e.x, e.y);
    else drawFlying(e.x, e.y);
  }

  drawMario(player.x, player.y);

  // Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 40;
    ctx.fillRect(p.x - camX - 2, p.y - 2, 4, 4);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  ctx.restore();

  // Level name
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 200, 4, 196, 22);
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
  ctx.fillText(LEVELS[levelIdx].name, W - 194, 20);

  if (godMode || flyMode) {
    const tags = [godMode && 'ÖLÜMSÜZ', flyMode && 'UÇUŞ'].filter(Boolean).join(' + ');
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(4, 4, 22 + tags.length * 8, 22);
    ctx.fillStyle = '#ffd700'; ctx.font = '12px monospace';
    ctx.fillText('☠ ' + tags, 10, 20);
  }

  drawBanner();
}

function showBanner(title, text, frames) {
  banner = { title, text, life: frames, max: frames };
}

function schedule(frames, fn) {
  pending = { frames, fn };
}

function updateTimers() {
  if (banner && --banner.life <= 0) banner = null;
  if (blamed && --blamed.life <= 0) blamed = null;
  if (pending && --pending.frames <= 0) {
    const fn = pending.fn;
    pending = null;
    fn();
  }
}

function drawBanner() {
  if (!banner) return;
  const t = banner.life / banner.max;
  const alpha = Math.max(0, Math.min(1, Math.min((1 - t) * 8, t * 3)));
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  const cy = H / 2 - 10 - (1 - t) * 18;
  ctx.fillStyle = '#000';
  ctx.font = 'bold 44px monospace';
  ctx.fillText(banner.title, W / 2 + 3, cy + 3);
  ctx.fillStyle = '#e52521';
  ctx.fillText(banner.title, W / 2, cy);
  ctx.fillStyle = '#000';
  ctx.font = '16px monospace';
  ctx.fillText(banner.text, W / 2 + 2, cy + 34);
  ctx.fillStyle = '#f2f2f2';
  ctx.fillText(banner.text, W / 2, cy + 32);
  ctx.restore();
  ctx.textAlign = 'left';
}

function showMsg(title, text, cb) {
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgText').textContent = text;
  document.getElementById('msg').style.display = 'block';
  document.getElementById('msgBtn').onclick = () => {
    document.getElementById('msg').style.display = 'none';
    if (cb) cb();
  };
}

function restartLevel() {
  pending = null;
  loadLevel(levelIdx);
}

function winLevel() {
  if (player.dead) return;
  player.dead = true;
  if (levelIdx < LEVELS.length - 1) {
    showBanner('BÖLÜM BİTTİ!', '...ya da öyle mi? Sıradaki daha kötü.', 110);
    schedule(80, () => {
      levelIdx++;
      loadLevel(levelIdx);
    });
  } else {
    showBanner('TEBRİKLER!', `Brutal Mario bitti. Kalan can: ${lives}. Carol etkilendi.`, 260);
    schedule(200, () => {
      levelIdx = 0; lives = 3; coins = 0;
      updateLives();
      document.getElementById('coins').textContent = 0;
      loadLevel(0);
    });
  }
}

function step() {
  updateMovingPlatforms();
  updatePlayer();
  updateEnemies();
  updateParticles();
  updateTimers();
}

// Oyunu tek kare ilerletir.
function gameLoop() {
  step();
  draw();
}

// Tarayıcı döngüsü. Telefon ekranları 120Hz olabiliyor ve fizik kare başına
// sabit adımlarla işlediği için oyun o ekranlarda iki kat hızlı akardı; adım
// sayısı bu yüzden ekran tazelemesinden ayrılıp saniyede 60'a sabitlendi.
const STEP_MS = 1000 / 60;
let stepDebt = 0, lastFrameTime = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (lastFrameTime === null) lastFrameTime = now;
  stepDebt += Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  for (let steps = 0; stepDebt >= STEP_MS && steps < 4; steps++) {
    step();
    stepDebt -= STEP_MS;
  }
  draw();
}

function startGame() {
  if (started) return;
  started = true;
  document.getElementById('msg').style.display = 'none';
  updateLives();
  loadLevel(levelIdx);
  requestAnimationFrame(frame);
}

function jumpToLevel(idx) {
  levelIdx = Math.max(0, Math.min(idx, LEVELS.length - 1));
  pending = null;
  banner = null;
  if (started) loadLevel(levelIdx);
  else startGame();
  showBanner(LEVELS[levelIdx].name, 'hile: bölüm atlandı', 70);
}

function toggleGod() {
  godMode = !godMode;
  if (godMode) player.dead = false;
  syncCheats();
}

function toggleFly() {
  flyMode = !flyMode;
  if (flyMode) {
    player.dead = false;
    player.vy = 0;
  }
  syncCheats();
}

function syncCheats() {
  const god = document.getElementById('godBtn');
  const fly = document.getElementById('flyBtn');
  god.className = godMode ? 'on' : '';
  fly.className = flyMode ? 'on' : '';
  god.textContent = godMode ? 'ÖLÜMSÜZ: AÇIK' : 'ÖLÜMSÜZ';
  fly.textContent = flyMode ? 'UÇUŞ: AÇIK' : 'UÇUŞ';
  document.getElementById('lvSelect').value = String(levelIdx);
}

function wireCheats() {
  document.getElementById('lvSelect').innerHTML =
    LEVELS.map((lv, i) => `<option value="${i}">${lv.name}</option>`).join('');
  const click = (id, fn) => {
    const el = document.getElementById(id);
    el.onclick = () => { fn(); el.blur(); };
  };
  click('prevLv', () => jumpToLevel(levelIdx - 1));
  click('nextLv', () => jumpToLevel(levelIdx + 1));
  click('godBtn', toggleGod);
  click('flyBtn', toggleFly);
  const select = document.getElementById('lvSelect');
  select.onchange = () => { jumpToLevel(Number(select.value)); select.blur(); };
  syncCheats();
}

// Telefonda klavye yok, o yüzden ekrandaki düğmeler doğrudan aynı tuşları
// basıyor. Parmak düğmeler arasında kayarsa da basılı kalsın diye her
// dokunuş olayında hangi düğmenin üstünde parmak varsa o yeniden hesaplanır.
function wireTouch() {
  const pad = document.getElementById('touch');
  const buttons = pad && pad.querySelectorAll ? [...pad.querySelectorAll('[data-key]')] : [];
  if (!buttons.length) return;

  const apply = (btn, on) => {
    keys[btn.dataset.key] = on;
    btn.classList.toggle('down', on);
  };
  const syncTouches = e => {
    e.preventDefault();
    const held = new Set();
    for (const touch of e.touches) {
      for (const btn of buttons) {
        const r = btn.getBoundingClientRect();
        if (touch.clientX >= r.left && touch.clientX <= r.right &&
            touch.clientY >= r.top && touch.clientY <= r.bottom) held.add(btn);
      }
    }
    for (const btn of buttons) apply(btn, held.has(btn));
  };
  for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
    pad.addEventListener(type, syncTouches, { passive: false });
  }
  // Fareyle de çalışsın, masaüstünde ?touch ile denemek için.
  for (const btn of buttons) {
    btn.addEventListener('mousedown', () => apply(btn, true));
    btn.addEventListener('mouseup', () => apply(btn, false));
    btn.addEventListener('mouseleave', () => apply(btn, false));
  }
  document.getElementById('touchRestart').onclick = () => restartLevel();

  const coarse = typeof matchMedia === 'function' &&
    matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (!coarse && !params.has('touch')) return;
  document.body.classList.add('touch');
  const orient = () => document.body.classList.toggle('portrait', innerHeight > innerWidth);
  orient();
  addEventListener('resize', orient);
  addEventListener('orientationchange', orient);
}

const params = new URLSearchParams(location.search);
levelIdx = Math.min(Math.max(parseInt(params.get('level') || '1', 10) - 1, 0), LEVELS.length - 1);
wireCheats();
wireTouch();

if (params.has('skipintro')) {
  startGame();
} else {
  showMsg('BRUTAL MARIO', 'Efsanevi SMW hack Brutal Mario\'dan ilham alındı. Hiçbir taşa güvenme. İyi şanslar.', startGame);
}
</script>
